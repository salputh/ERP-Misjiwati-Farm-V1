# Nginx configuration untuk demo ERP Misjiwati Farm
# File: /etc/nginx/sites-available/erp-misjiwati-demo

# Rate limiting untuk demo - lebih ketat dari production
limit_req_zone $binary_remote_addr zone=demolimit:10m rate=10r/s;

# Redirect HTTP ke HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name demofarm.salmanrizwana.com;

    # ACME challenge untuk Let's Encrypt
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name demofarm.salmanrizwana.com;

    root /var/www/erp-misjiwati-demo/public;
    index index.php;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/demofarm.salmanrizwana.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demofarm.salmanrizwana.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:DemoSSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header X-Demo-Mode "true" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    # Charset
    charset utf-8;

    # Logging
    access_log /var/log/nginx/demofarm.salmanrizwana.com.access.log;
    error_log /var/log/nginx/demofarm.salmanrizwana.com.error.log;

    # Rate limiting global untuk demo
    limit_req zone=demolimit burst=20 nodelay;

    # Main location
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Livewire 4 menyajikan JavaScript dan CSS melalui route Laravel.
    location ^~ /livewire- {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location = /index.php {
        fastcgi_pass unix:/var/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ \.php$ {
        return 404;
    }

    # Deny .env, .git, dan file sensitif lainnya
    location ~ /\.(?!well-known).* {
        deny all;
        return 404;
    }

    location ~* \.(sqlite|sqlite3|db|sql|log|sh|bak|env|ini|lock)$ {
        return 404;
    }

    # Deny akses langsung ke storage
    location ~ ^/storage/.* {
        deny all;
        return 404;
    }

    # Static assets caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Favicon
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # Robots.txt
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # Client body size (untuk upload file)
    client_max_body_size 20M;
}
